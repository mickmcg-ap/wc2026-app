<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Cup 2026</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0d1117;
    --bg-card: #161b22;
    --bg-panel: #0a0e19;
    --bg-header: #0c1a10;
    --border: #21262d;
    --border-subtle: #11161f;
    --green: #25c2a0;
    --green-dim: #34d399;
    --red: #dc2626;
    --red-pulse: #ef4444;
    --yellow: #fbbf24;
    --blue: #1d4ed8;
    --text-primary: #c9d1d9;
    --text-secondary: #9ca3af;
    --text-dim: #6b7280;
    --text-muted: #9ca3af;
  }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    font-size: 15px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Traffic light drag region */
  .titlebar {
    -webkit-app-region: drag;
    height: 38px;
    background: linear-gradient(135deg, #0c3a22, #0a2236);
    border-bottom: 1px solid #1c2b22;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }
  .titlebar-title {
    font-size: 14px;
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.5px;
    padding-left: 70px; /* make room for traffic lights */
  }
  .live-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--red-pulse);
    display: inline-block;
    margin-right: 5px;
    animation: pulse 1.2s infinite;
  }

  /* Header */
  .hdr {
    background: linear-gradient(120deg, #0c3a22, #0a2236 70%);
    border-bottom: 1px solid #1c2b22;
    padding: 14px 16px 12px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  .hdr::after {
    content: '';
    position: absolute; top: 0; bottom: 0; width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.06), transparent);
    transform: translateX(-150%);
    animation: shine 6s ease-in-out infinite;
  }
  .hdr-inner { display: flex; align-items: center; justify-content: space-between; }
  .hdr-left { display: flex; align-items: center; gap: 11px; }
  .ball { font-size: 24px; animation: spin 9s linear infinite; display: inline-block; }
  .h-title { font-size: 19px; font-weight: 800; color: #fff; }
  .h-sub { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
  .h-sub b { color: var(--green); }
  .hdr-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .h-badge {
    display: inline-block; background: var(--red); color: #fff;
    font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 6px;
    letter-spacing: 1.5px; animation: pulse 1.6s ease-in-out infinite;
  }
  .h-time { font-size: 11px; color: var(--text-secondary); }
  .h-next { font-size: 11px; color: var(--text-secondary); text-align: right; }

  /* Stats bar */
  .sbar {
    display: flex;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
  }
  .sb { flex: 1; text-align: center; padding: 8px 4px; border-right: 1px solid var(--border-subtle); }
  .sb:last-child { border-right: none; }
  .sb-v { font-size: 18px; font-weight: 800; color: #e5e7eb; }
  .sb-l { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 1px; }
  .sb-live .sb-v { color: var(--green-dim); }

  /* Tabs */
  .tabs {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 4px;
    padding: 7px 8px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
  }
  .tab {
    -webkit-app-region: no-drag;
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 6px;
    font: inherit;
    font-size: 12px;
    font-weight: 800;
    height: 28px;
    line-height: 1;
    overflow: hidden;
    padding: 0 5px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }
  .tab-active {
    background: rgba(37,194,160,0.12);
    border-color: rgba(37,194,160,0.28);
    color: #d1fae5;
  }

  /* Scrollable content */
  .scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .scroll::-webkit-scrollbar { width: 6px; }
  .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .scroll::-webkit-scrollbar-thumb:hover { background: #2d3748; }

  /* Section headers */
  .sec {
    padding: 9px 16px 5px;
    font-size: 11px; font-weight: 700;
    color: var(--text-dim);
    letter-spacing: 2px;
    text-transform: uppercase;
    display: flex; align-items: center; gap: 8px;
  }
  .sec::after { content: ''; flex: 1; height: 1px; background: var(--bg-card); }

  /* Day headers in schedule */
  .day-hdr {
    padding: 6px 16px;
    font-size: 12px; font-weight: 700;
    color: var(--text-muted);
    background: var(--bg-panel);
    border-top: 1px solid var(--border-subtle);
    border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 1;
  }
  .day-today { color: var(--yellow); background: rgba(251,191,36,0.07); }
  .day-cnt { font-size: 11px; color: var(--text-dim); font-weight: 400; }

  /* Full game card (today's matches) */
  .game { padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); }
  .game-live { background: rgba(220,38,38,0.05); border-left: 3px solid var(--red); padding-left: 13px; }
  .g-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .g-status { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
  .g-live { color: var(--green-dim); }
  .g-pre { color: var(--text-muted); }
  .g-post { color: var(--text-dim); }
  .ldot { width: 6px; height: 6px; border-radius: 50%; background: var(--red-pulse); display: inline-block; animation: pulse 1.2s infinite; }
  .g-tag { font-size: 11px; color: var(--text-muted); background: var(--bg-card); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
  .g-teams { display: flex; align-items: center; gap: 10px; }
  .team { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .team-r { flex-direction: row-reverse; }
  .logo { width: 26px; height: 26px; object-fit: contain; border-radius: 50%; background: var(--bg-card); flex-shrink: 0; border: 1px solid var(--border); padding: 2px; }
  .ti { min-width: 0; flex: 1; }
  .team-r .ti { text-align: right; }
  .tn { font-size: 15px; font-weight: 600; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tn-w { color: #fff; font-weight: 800; }
  .tn-l { color: #6b7280; }
  .scorebox { flex-shrink: 0; min-width: 64px; }
  .snums { display: flex; align-items: center; justify-content: center; gap: 4px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; }
  .sc { font-size: 22px; font-weight: 800; color: #fff; min-width: 14px; text-align: center; line-height: 1; }
  .ssep { font-size: 14px; color: #4b5563; }
  .vs-txt { font-size: 13px; color: #6b7280; font-weight: 700; padding: 5px 6px; }
  .venue { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

  /* Schedule row (compact) */
  .sg { display: flex; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border-subtle); gap: 8px; }
  .sg-live { background: rgba(220,38,38,0.06); border-left: 3px solid var(--red); padding-left: 13px; }
  .sg-t { font-size: 13px; color: var(--text-muted); font-weight: 600; min-width: 38px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .sg-t-live { color: var(--green-dim); }
  .sg-t-post { color: var(--text-dim); }
  .sg-flags { display: flex; gap: 2px; flex-shrink: 0; }
  .sg-flag { width: 15px; height: 15px; object-fit: contain; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border); }
  .sg-info { flex: 1; min-width: 0; }
  .sg-match { font-size: 14px; color: var(--text-primary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sg-match-live { color: #fff; font-weight: 700; }
  .sg-match-post { color: var(--text-muted); }
  .sg-meta { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .sg-res { font-size: 15px; font-weight: 800; color: #9ca3af; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
  .sg-res-live { color: #fff; }
  .sg-dash { font-size: 14px; color: var(--border); min-width: 40px; text-align: center; }

  /* Groups */
  .group-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 10px;
    padding: 10px;
  }
  .grp-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .grp-h {
    align-items: center;
    background: #0f172a;
    border-bottom: 1px solid var(--border);
    color: #fff;
    display: flex;
    font-size: 14px;
    font-weight: 900;
    justify-content: space-between;
    letter-spacing: 1px;
    padding: 8px 10px;
    text-transform: uppercase;
  }
  .grp-table {
    border-collapse: collapse;
    font-size: 12px;
    table-layout: fixed;
    width: 100%;
  }
  .grp-team-col { width: 43%; }
  .grp-stat-col { width: 7.125%; }
  .grp-table th {
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 800;
    padding: 6px 4px;
    text-align: right;
    text-transform: uppercase;
  }
  .grp-table th:first-child { text-align: left; padding-left: 10px; }
  .grp-table td {
    border-top: 1px solid var(--border-subtle);
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    padding: 7px 4px;
    text-align: right;
  }
  .grp-table td:first-child {
    color: var(--text-primary);
    font-weight: 700;
    min-width: 0;
    padding-left: 10px;
    text-align: left;
  }
  .grp-team { align-items: center; display: flex; gap: 7px; min-width: 0; }
  .grp-logo {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 50%;
    flex-shrink: 0;
    height: 18px;
    object-fit: contain;
    padding: 1px;
    width: 18px;
  }
  .grp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp-pts { color: #fff !important; font-weight: 900; }

  /* Wall chart */
  .wall-wrap {
    overflow-x: auto;
    overflow-y: hidden;
    padding: 10px 12px 16px;
  }
  .wall-toolbar {
    align-items: center;
    display: flex;
    justify-content: flex-end;
    padding: 0 12px 8px;
  }
  .wall-toggle {
    -webkit-app-region: no-drag;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    font: inherit;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1px;
    padding: 7px 10px;
    text-transform: uppercase;
  }
  .wall-toggle:hover { color: var(--text-primary); }
  .wall-toggle-on {
    background: rgba(251,191,36,0.12);
    border-color: rgba(251,191,36,0.65);
    color: #fde68a;
  }
  .wall {
    display: grid;
    column-gap: 12px;
    row-gap: 10px;
    grid-template-columns: repeat(4, minmax(118px, 1fr)) minmax(160px, 1.25fr) repeat(4, minmax(118px, 1fr));
    grid-template-areas:
      "lr32 lr16 lqf lsf centre rsf rqf rr16 rr32"
      "bottom bottom bottom bottom bottom bottom bottom bottom bottom";
    min-width: 1120px;
    width: max(1120px, 100%);
    position: relative;
  }
  .wall-left-r32 { grid-area: lr32; }
  .wall-left-r16 { grid-area: lr16; }
  .wall-left-qf { grid-area: lqf; }
  .wall-left-sf { grid-area: lsf; }
  .wall-centre {
    display: grid;
    grid-area: centre;
    grid-template-rows: 28px repeat(8, 55px);
    row-gap: 6px;
  }
  .wall-right-sf { grid-area: rsf; }
  .wall-right-qf { grid-area: rqf; }
  .wall-right-r16 { grid-area: rr16; }
  .wall-right-r32 { grid-area: rr32; }
  .wall-bottom-groups { grid-area: bottom; display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px; padding-top: 14px; }
  .wall-col {
    display: grid;
    grid-template-rows: 28px repeat(8, 55px);
    row-gap: 6px;
    position: relative;
  }
  .wall-title {
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: #fff;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 1px;
    padding: 6px 8px;
    text-align: center;
    text-transform: uppercase;
  }
  .mini-group,
  .wall-match {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .mini-group-h {
    background: #ef4123;
    color: #fff;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 1px;
    padding: 5px 7px;
    text-transform: uppercase;
  }
  .mini-team {
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.04);
    color: var(--text-primary);
    display: flex;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    min-height: 21px;
    padding: 3px 7px;
  }
  .mini-team .grp-name { flex: 1; min-width: 0; }
  .mini-pos {
    color: var(--text-dim);
    flex-shrink: 0;
    font-size: 10px;
    text-align: right;
    width: 12px;
  }
  .mini-pts {
    color: #fff;
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 900;
  }
  .wall-match {
    min-height: 54px;
    overflow: visible;
    padding: 5px 7px 7px;
    position: relative;
    z-index: 2;
  }
  .wall-match-live {
    background: linear-gradient(rgba(220,38,38,0.12), rgba(220,38,38,0.12)), var(--bg-card);
    border-color: rgba(239,68,68,0.65);
  }
  .wall-match-post { background: #111827; }
  .wm-meta {
    color: var(--text-dim);
    display: flex;
    font-size: 10px;
    font-weight: 800;
    justify-content: space-between;
    line-height: 1.1;
    margin-bottom: 3px;
    text-transform: uppercase;
  }
  .wm-team {
    align-items: center;
    display: grid;
    gap: 5px;
    grid-template-columns: minmax(0, 1fr) 22px;
    min-height: 15px;
  }
  .wm-name {
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 700;
    line-height: 1.15;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .wm-score {
    color: #fff;
    font-size: 13px;
    font-weight: 900;
    line-height: 1.15;
    text-align: right;
  }
  .wm-pre .wm-score { color: var(--text-dim); }
  .wall-empty {
    color: var(--text-muted);
    font-size: 13px;
    padding: 9px;
    text-align: center;
  }
  .wall-centre-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    align-self: center;
    overflow: hidden;
  }
  .wall-centre-card .wall-title { border: none; border-radius: 0; }
  .wall-slot {
    align-self: center;
    position: relative;
  }
  .wall-slot .wall-match { height: 54px; }
  .wall-lines {
    height: 516px;
    left: 0;
    position: absolute;
    top: 0;
    width: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .wall-lines path {
    fill: none;
    stroke: rgba(201,209,217,0.52);
    stroke-linecap: square;
    stroke-linejoin: miter;
    stroke-width: 2;
  }

  /* Empty state */
  .empty { padding: 32px 16px; text-align: center; }
  .ei { font-size: 40px; margin-bottom: 12px; display: inline-block; animation: spin 9s linear infinite; }
  .et { font-size: 17px; color: var(--text-primary); font-weight: 700; margin-bottom: 6px; }
  .es { font-size: 14px; color: var(--text-dim); line-height: 1.7; }

  /* Footer */
  .foot {
    padding: 7px 16px;
    background: var(--bg-panel);
    border-top: 1px solid #1c2b22;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .ft { font-size: 11px; color: var(--text-dim); }
  .ft b { color: var(--text-muted); }
  .refresh-btn {
    font-size: 11px; color: var(--text-dim);
    cursor: pointer; padding: 2px 6px;
    border-radius: 4px; border: 1px solid var(--border);
    background: var(--bg-card);
    -webkit-app-region: no-drag;
  }
  .refresh-btn:hover { color: var(--text-primary); }
  .refresh-btn.refreshing { color: var(--text-primary); cursor: default; pointer-events: none; }
  .refresh-btn.refreshing #refresh-icon { display: inline-block; animation: spin 0.8s linear infinite; }

  /* Loading */
  #loading {
    display: flex; align-items: center; justify-content: center;
    flex: 1; flex-direction: column; gap: 12px;
  }
  .spinner {
    font-size: 32px; animation: spin 1.5s linear infinite;
  }
  .loading-txt { font-size: 14px; color: var(--text-muted); }

  /* Error */
  #error-banner {
    background: rgba(220,38,38,0.1);
    border-bottom: 1px solid rgba(220,38,38,0.3);
    padding: 8px 16px;
    font-size: 13px; color: #fca5a5;
    display: none;
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes spin { to { transform: rotate(360deg) } }
  @keyframes shine { 0%{transform:translateX(-150%)} 55%,100%{transform:translateX(320%)} }
  @keyframes fadein { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

  .fadein { animation: fadein .3s ease; }

  /* Highlights button */
  .hl-btn {
    -webkit-app-region: no-drag;
    background: none;
    border: none;
    color: var(--red-pulse);
    cursor: pointer;
    font-size: 13px;
    padding: 3px 6px;
    border-radius: 4px;
    flex-shrink: 0;
    line-height: 1;
    opacity: 0.85;
  }
  .hl-btn:hover { opacity: 1; background: rgba(239,68,68,0.15); }
  .hl-btn-empty { visibility: hidden; pointer-events: none; }

  /* Highlights video modal */
  .yt-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    -webkit-app-region: no-drag;
  }
  .yt-overlay.open { display: flex; }
  .yt-modal {
    position: relative;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    width: 440px;
  }
  .yt-close {
    position: absolute;
    top: 6px;
    right: 8px;
    z-index: 1;
    background: rgba(0,0,0,0.65);
    border: none;
    border-radius: 50%;
    color: #fff;
    cursor: pointer;
    font-size: 15px;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-app-region: no-drag;
  }
  .yt-frame {
    display: block;
    width: 440px;
    height: 248px;
    border: none;
  }

  /* Match stats modal */
  .stats-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
    -webkit-app-region: no-drag;
  }
  .stats-overlay.open { display: flex; }
  .stats-modal {
    position: relative;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 420px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
  }
  .stats-modal::-webkit-scrollbar { width: 4px; }
  .stats-modal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .stats-close {
    position: absolute;
    top: 8px; right: 10px;
    z-index: 1;
    background: rgba(0,0,0,0.5);
    border: none;
    border-radius: 50%;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    width: 26px; height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-app-region: no-drag;
  }
  .stats-header {
    background: #0f172a;

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;',
  }[ch]))
}

function isKnockoutPlaceholderName(name) {
  return /^(?:W|RU)\d+$|^(?:RD32|RD16|QF|SF)\b|Round of|Quarterfinal|Semifinal/i.test(String(name || '').trim())
}

// Returns a class + attribute fragment that makes a team name clickable,
// opening its team popup. Skipped for undetermined knockout slots ("TBD").
function teamLinkFrag(abbr, name) {
  if ((!abbr && (!name || name === 'TBD')) || isKnockoutPlaceholderName(name) || isKnockoutPlaceholderName(abbr)) return { cls: '', attrs: '' }
  return { cls: ' team-link', attrs: ` data-team-abbr="${esc(abbr || '')}" data-team-name="${esc(name || '')}"` }
}

function slugLabel(s) {
  if (!s) return ''
  return String(s)
    .replace('group-stage', 'Group Stage')
    .replace(/group-([a-z])/i, (_, l) => 'Group ' + l.toUpperCase())
    .replace('round-of-32', 'Round of 32')
    .replace('round-of-16', 'Round of 16')
    .replace('quarterfinal', 'Quarter-final')
    .replace('semifinal', 'Semi-final')
    .replace(/\bfinal\b/, 'Final')
}

function mapGame(ev) {
  const comp = (ev.competitions || [])[0] || {}
  const st = (comp.status || {}).type || {}
  const cs = comp.competitors || []
  const h = cs.find(c => c.homeAway === 'home') || cs[0] || {}
  const a = cs.find(c => c.homeAway === 'away') || cs[1] || {}
  return {
    id: ev.id,
    date: new Date(ev.date),
    name: ev.name || '',
    shortName: ev.shortName || '',
    state: st.state || 'pre',
    desc: st.shortDetail || '',
    clock: (comp.status || {}).displayClock || '',
    group: (ev.season || {}).slug || '',
    h: { id: (h.team||{}).id||'', abbr: (h.team||{}).abbreviation||'', short: (h.team||{}).shortDisplayName||'TBD', logo: (h.team||{}).logo||'', score: h.score ?? '0', w: h.winner||false },
    a: { id: (a.team||{}).id||'', abbr: (a.team||{}).abbreviation||'', short: (a.team||{}).shortDisplayName||'TBD', logo: (a.team||{}).logo||'', score: a.score ?? '0', w: a.winner||false },
    venue: ((comp.venue||{}).fullName)||'',
    city: (((comp.venue||{}).address)||{}).city||'',
  }
}

function stat(entry, names, fallback = '-') {
  const stats = entry.stats || []
  const wanted = names.map(n => String(n).toLowerCase())
  const item = stats.find(s => {
    const keys = [s.name, s.displayName, s.shortDisplayName, s.abbreviation].map(k => String(k || '').toLowerCase())
    return keys.some(k => wanted.includes(k))
  })
  if (!item) return fallback
  return item.displayValue ?? item.value ?? fallback
}

function mapStandingEntry(entry, idx) {
  const team = entry.team || {}
  const logos = team.logos || []
  return {
    rank: idx + 1,
    name: team.shortDisplayName || team.displayName || team.name || entry.name || 'TBD',
    abbr: team.abbreviation || '',
    logo: team.logo || (logos[0] || {}).href || '',
    played: stat(entry, ['gp', 'gamesplayed', 'played', 'matchesplayed']),
    wins: stat(entry, ['w', 'wins']),
    draws: stat(entry, ['d', 'draws', 't', 'ties']),
    losses: stat(entry, ['l', 'losses']),
    gf: stat(entry, ['gf', 'goalsfor', 'pointsfor']),
    ga: stat(entry, ['ga', 'goalsagainst', 'pointsagainst']),
    gd: stat(entry, ['gd', 'goaldifference', 'differential', 'pointdifferential']),
    pts: stat(entry, ['pts', 'points']),
  }
}

function mapStandingGroup(data) {
  const groups = []
  const seen = new Set()

  function walk(node) {
    if (!node || typeof node !== 'object') return
    const entries = ((node.standings || {}).entries) || node.entries
    if (Array.isArray(entries) && entries.length) {
      const name = node.name || node.displayName || node.shortName || (node.group || {}).name || `Group ${groups.length + 1}`
      const key = `${name}:${entries.length}`
      if (!seen.has(key)) {
        seen.add(key)
        groups.push({
          name,
          teams: entries.map(mapStandingEntry),
        })
      }
    }
    ;['children', 'groups', 'standingsGroups'].forEach(k => {
      if (Array.isArray(node[k])) node[k].forEach(walk)
    })
  }

  walk(data)
  return groups.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
}

function groupLetter(idx) {
  return String.fromCharCode(65 + idx)
}

function teamKey(team) {
  return team.id || team.abbr || team.short
}

function emptyStanding(team, rank = 1) {
  return {
    rank,
    name: team.short,
    abbr: team.abbr,
    logo: team.logo,
    played: 0,
    wins: 0,
    draws: 0,
    losses: 0,
    gf: 0,
    ga: 0,
    gd: 0,
    pts: 0,
  }
}

function scheduleStandingGroups(games) {
  const groupGames = games.filter(g => getRound(g) === 'group' && teamKey(g.h) && teamKey(g.a) && g.h.short !== 'TBD' && g.a.short !== 'TBD')
  const teams = new Map()
  const links = new Map()
  const firstSeen = new Map()

  function addTeam(team, date) {
    const key = teamKey(team)
    if (!teams.has(key)) teams.set(key, { ...team })
    if (!links.has(key)) links.set(key, new Set())
    if (!firstSeen.has(key) || date < firstSeen.get(key)) firstSeen.set(key, date)
    return key
  }

  groupGames.forEach(g => {
    const hk = addTeam(g.h, g.date)
    const ak = addTeam(g.a, g.date)
    links.get(hk).add(ak)
    links.get(ak).add(hk)
  })

  const seen = new Set()
  const components = []
  teams.forEach((_, start) => {
    if (seen.has(start)) return
    const stack = [start], comp = []
    seen.add(start)
    while (stack.length) {
      const key = stack.pop()
      comp.push(key)
      ;(links.get(key) || []).forEach(next => {
        if (!seen.has(next)) {
          seen.add(next)
          stack.push(next)
        }
      })
    }
    components.push(comp)
  })

  components.sort((a, b) => {
    const ad = Math.min(...a.map(k => firstSeen.get(k)?.getTime() || Infinity))
    const bd = Math.min(...b.map(k => firstSeen.get(k)?.getTime() || Infinity))
    return ad - bd
  })

  return components.map((keys, groupIdx) => {
    const table = new Map(keys.map((key, idx) => [key, emptyStanding(teams.get(key), idx + 1)]))

    groupGames.forEach(g => {
      const hk = teamKey(g.h), ak = teamKey(g.a)
      if (!table.has(hk) || !table.has(ak) || g.state !== 'post') return
      const hs = Number(g.h.score), as = Number(g.a.score)
      if (!Number.isFinite(hs) || !Number.isFinite(as)) return
      const home = table.get(hk), away = table.get(ak)

      home.played += 1
      away.played += 1
      home.gf += hs
      home.ga += as
      away.gf += as
      away.ga += hs

      if (hs > as) {
        home.wins += 1
        home.pts += 3
        away.losses += 1
      } else if (as > hs) {
        away.wins += 1
        away.pts += 3
        home.losses += 1
      } else {
        home.draws += 1
        away.draws += 1
        home.pts += 1
        away.pts += 1
      }
    })

    const ordered = [...table.values()]
      .map(t => ({ ...t, gd: t.gf - t.ga }))
      .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.name.localeCompare(b.name))
      .map((t, idx) => ({ ...t, rank: idx + 1 }))

    return {
      name: `Group ${groupLetter(groupIdx)}`,
      teams: ordered,
    }
  })
}

function groupsForView(rawStandings, games) {
  const groups = mapStandingGroup(rawStandings)
  return groups.length ? groups : scheduleStandingGroups(games)
}

function buildTeamGroupMap(groups) {
  const map = {}
  groups.forEach((group, idx) => {
    const letter = groupLetterFromName(group.name, idx)
    group.teams.forEach(t => {
      if (t.abbr) map[t.abbr.toUpperCase()] = letter
      if (t.name) map[t.name.toLowerCase()] = letter
    })
  })
  return map
}

function teamFromStanding(t) {
  if (!t) return null
  return {
    id: '',
    abbr: t.abbr || '',
    short: t.name || 'TBD',
    logo: t.logo || '',
    score: '0',
    w: false,
  }
}

function groupLetterFromName(name, idx) {
  const match = String(name || '').match(/Group\s+([A-L])/i)
  return match ? match[1].toUpperCase() : groupLetter(idx)
}

function groupLookup(groups) {
  return groups.reduce((acc, group, idx) => {
    acc[groupLetterFromName(group.name, idx)] = group
    return acc
  }, {})
}

function parseGroupPlaceRef(ref) {
  const match = String(ref || '').match(/\b([12])\s*([A-L])\b/i)
  if (!match) return null
  return { place: Number(match[1]), letter: match[2].toUpperCase() }
}

function parseThirdCandidates(ref) {
  const match = String(ref || '').match(/\b3RD\s+([A-L](?:\/[A-L])*)/i)
  if (!match) return null
  return match[1]
    .split('/')
    .map(letter => letter.trim().toUpperCase())
    .filter(Boolean)
    .sort()
    .join('')
}

function thirdCandidatesLabel(thirdCandidates) {
  return thirdCandidates ? `3RD ${thirdCandidates.split('').join('/')}` : ''
}

function canonicalR32SideLabel(side, otherSide) {
  const text = String(side?.short || '')
  const direct = parseGroupPlaceRef(text)
  if (direct) return `${direct.place}${direct.letter}`

  const thirdCandidates = parseThirdCandidates(text)
  if (thirdCandidates) return thirdCandidatesLabel(thirdCandidates)

  const otherText = String(otherSide?.short || '')
  const otherDirect = parseGroupPlaceRef(otherText)
  const otherThirdCandidates = parseThirdCandidates(otherText)

  if (otherThirdCandidates) {
    const winnerGroup = THIRD_PLACE_CANDIDATE_TO_WINNER[otherThirdCandidates]
    if (winnerGroup) return `1${winnerGroup}`
  }

  if (otherDirect?.place === 2) {
    const winnerGroup = RUNNER_UP_TO_WINNER_GROUP[otherDirect.letter]
    if (winnerGroup) return `1${winnerGroup}`
  }

  return text || 'TBD'
}

function canonicalR32PlaceholderGames(games) {
  return games.map(game => ({
    ...game,
    h: { ...game.h, short: canonicalR32SideLabel(game.h, game.a) },
    a: { ...game.a, short: canonicalR32SideLabel(game.a, game.h) },
  }))
}

function standingByGroupPlace(groupsByLetter, place, letter) {
  const group = groupsByLetter[letter]
  return group?.teams?.[place - 1] || null
}

function numberStat(value) {
  const parsed = Number(value)
  if (Number.isFinite(parsed)) return parsed
  const fallback = Number(String(value || '').replace(/[^\d.-]/g, ''))
  return Number.isFinite(fallback) ? fallback : 0
}

function topThirdPlaceLetters(groupsByLetter) {
  return Object.entries(groupsByLetter)
    .map(([letter, group]) => ({ letter, team: group?.teams?.[2] || null }))
    .filter(entry => entry.team)
    .sort((a, b) =>
      numberStat(b.team.pts) - numberStat(a.team.pts) ||
      numberStat(b.team.gd) - numberStat(a.team.gd) ||
      numberStat(b.team.gf) - numberStat(a.team.gf) ||
      String(a.team.name || '').localeCompare(String(b.team.name || ''))
    )
    .map(entry => entry.letter)
}

function thirdPlaceAssignments(groupsByLetter) {
  const bestThirds = topThirdPlaceLetters(groupsByLetter).slice(0, 8)
  if (bestThirds.length < 8) return {}
  const comboKey = [...bestThirds].sort().join('')
  const encoded = THIRD_PLACE_COMBINATION_MAP[comboKey]
  if (!encoded || encoded.length !== THIRD_PLACE_WINNER_ORDER.length) return {}
  return THIRD_PLACE_WINNER_ORDER.reduce((acc, winnerGroup, idx) => {
    acc[winnerGroup] = encoded[idx]
    return acc
  }, {})
}

function projectR32Game(game, groupsByLetter, thirdAssignments) {
  const homeRef = String(game.h.short || '')
  const awayRef = String(game.a.short || '')
  const homeDirect = parseGroupPlaceRef(homeRef)
  const awayDirect = parseGroupPlaceRef(awayRef)
  const homeThirdCandidates = parseThirdCandidates(homeRef)
  const awayThirdCandidates = parseThirdCandidates(awayRef)

  const homeStanding = homeDirect ? standingByGroupPlace(groupsByLetter, homeDirect.place, homeDirect.letter) : null
  const awayStanding = awayDirect ? standingByGroupPlace(groupsByLetter, awayDirect.place, awayDirect.letter) : null
  let projectedHome = homeStanding ? { ...game.h, ...teamFromStanding(homeStanding) } : game.h
  let projectedAway = awayStanding ? { ...game.a, ...teamFromStanding(awayStanding) } : game.a

  const thirdCandidates = homeThirdCandidates || awayThirdCandidates
  if (thirdCandidates) {
    const winnerGroup = THIRD_PLACE_CANDIDATE_TO_WINNER[thirdCandidates]
    if (winnerGroup) {
      const winnerStanding = standingByGroupPlace(groupsByLetter, 1, winnerGroup)
      const thirdGroup = thirdAssignments[winnerGroup]
      const thirdStanding = thirdGroup ? standingByGroupPlace(groupsByLetter, 3, thirdGroup) : null

      if (homeThirdCandidates) {
        if (thirdStanding) projectedHome = { ...projectedHome, ...teamFromStanding(thirdStanding) }
        if (winnerStanding) projectedAway = { ...projectedAway, ...teamFromStanding(winnerStanding) }
      } else {
        if (winnerStanding) projectedHome = { ...projectedHome, ...teamFromStanding(winnerStanding) }
        if (thirdStanding) projectedAway = { ...projectedAway, ...teamFromStanding(thirdStanding) }
      }
    }
  } else {
    if (!homeDirect && awayDirect?.place === 2) {
      const winnerGroup = RUNNER_UP_TO_WINNER_GROUP[awayDirect.letter]
      const winnerStanding = winnerGroup ? standingByGroupPlace(groupsByLetter, 1, winnerGroup) : null
      if (winnerStanding) projectedHome = { ...projectedHome, ...teamFromStanding(winnerStanding) }
    }
    if (!awayDirect && homeDirect?.place === 2) {
      const winnerGroup = RUNNER_UP_TO_WINNER_GROUP[homeDirect.letter]
      const winnerStanding = winnerGroup ? standingByGroupPlace(groupsByLetter, 1, winnerGroup) : null
      if (winnerStanding) projectedAway = { ...projectedAway, ...teamFromStanding(winnerStanding) }
    }
  }

  return { ...game, h: projectedHome, a: projectedAway }
}

function projectedR32Games(games, groups) {
  const referenceGames = canonicalR32PlaceholderGames(games)
  if (!projectKnockouts) return referenceGames
  const groupsByLetter = groupLookup(groups)
  const thirdAssignments = thirdPlaceAssignments(groupsByLetter)
  return referenceGames.map(g => projectR32Game(g, groupsByLetter, thirdAssignments))
}

function fifaMatchNumber(game) {
  return FIFA_MATCH_NUMBER_BY_ESPN_ID[String(game?.id || '')] || null
}

function orderedKnockoutRound(games, round) {
  const order = WALL_ROUND_MATCH_ORDER[round] || []
  return [...games].sort((a, b) => {
    const ai = order.indexOf(fifaMatchNumber(a))
    const bi = order.indexOf(fifaMatchNumber(b))
    if (ai !== -1 || bi !== -1) return (ai === -1 ? Infinity : ai) - (bi === -1 ? Infinity : bi)
    return a.date - b.date
  })
}

function officialKnockoutPlaceholderGame(game) {
  const refs = FIFA_KNOCKOUT_PREDECESSORS[fifaMatchNumber(game)]
  if (!refs) return game

  const sideWithLabel = (side, label) => {
    if (!isKnockoutPlaceholderName(side.short) && !isKnockoutPlaceholderName(side.abbr)) return side
    return { ...side, abbr: '', short: label, logo: '' }
  }

  return {
    ...game,
    h: sideWithLabel(game.h, refs[0]),
    a: sideWithLabel(game.a, refs[1]),
  }
}

function groupByDay(games) {
  const map = {}, keys = []
  games.forEach(g => {
    const k = g.date.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' })
    if (!map[k]) { map[k] = []; keys.push(k) }
    map[k].push(g)
  })
  return keys.map(k => [k, map[k]])
}

function fmt(date) {
  return date.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })
}

function shortDate(date) {
  return date.toLocaleDateString('en-GB', { day:'2-digit', month:'short' })
}

function getRound(g) {
  const slug = String(g.group || '').toLowerCase()
  if (slug === '3rd-place-match') return 'bronze'
  if (slug === 'final') return 'final'
  if (slug === 'semifinals') return 'semi'
  if (slug === 'quarterfinals') return 'quarter'
  if (slug === 'round-of-16') return 'r16'
  if (slug === 'round-of-32') return 'r32'
  if (slug === 'group-stage') return 'group'

  const txt = [g.group, g.name, g.shortName, g.desc].join(' ').toLowerCase()
  if (/3rd-place-match|third-place match|bronze|semifinal \d loser|sf l\d/.test(txt)) return 'bronze'
  if (/\bfinal\b/.test(txt) && !/semi|quarter|round/.test(txt)) return 'final'
  if (/semi/.test(txt)) return 'semi'
  if (/quarter/.test(txt)) return 'quarter'
  if (/round.of.16|last.16/.test(txt)) return 'r16'
  if (/round.of.32|last.32/.test(txt)) return 'r32'
  if (/group/.test(txt)) return 'group'

  const d = new Date(g.date)
  const md = Number(`${String(d.getUTCMonth() + 1).padStart(2, '0')}${String(d.getUTCDate()).padStart(2, '0')}`)
  if (md <= 627) return 'group'
  if (md <= 703) return 'r32'
  if (md <= 707) return 'r16'
  if (md <= 711) return 'quarter'
  if (md <= 715) return 'semi'
  if (md === 718) return 'bronze'
  if (md >= 719) return 'final'
  return 'group'
}

function wallLinesSVG() {
  const rowY = Array.from({ length: 8 }, (_, idx) => 62 + idx * 61)
  const r16Y = [0, 2, 4, 6].map(i => (rowY[i] + rowY[i + 1]) / 2)
  const qfY = [0, 2].map(i => (r16Y[i] + r16Y[i + 1]) / 2)
  const sfY = [(qfY[0] + qfY[1]) / 2]

  function bracket(x1, xMid, x2, y1, y2, yTarget) {
    return `M ${x1} ${y1} H ${xMid} V ${y2} M ${x1} ${y2} H ${xMid} M ${xMid} ${yTarget} H ${x2}`
  }

  const paths = []
  for (let i = 0; i < 4; i++) paths.push(bracket(92, 107, 122, rowY[i * 2], rowY[i * 2 + 1], r16Y[i]))
  for (let i = 0; i < 2; i++) paths.push(bracket(222, 237, 252, r16Y[i * 2], r16Y[i * 2 + 1], qfY[i]))
  paths.push(bracket(352, 367, 402, qfY[0], qfY[1], sfY[0]))

  for (let i = 0; i < 4; i++) paths.push(bracket(908, 893, 878, rowY[i * 2], rowY[i * 2 + 1], r16Y[i]))
  for (let i = 0; i < 2; i++) paths.push(bracket(778, 763, 748, r16Y[i * 2], r16Y[i * 2 + 1], qfY[i]))
  paths.push(bracket(648, 633, 598, qfY[0], qfY[1], sfY[0]))

  return `
    <svg class="wall-lines" viewBox="0 0 1000 516" preserveAspectRatio="none" aria-hidden="true">
      ${paths.map(d => `<path d="${d}"/>`).join('')}
    </svg>`
}

function renderWallChart(sg, rawStandings) {
  const groups = groupsForView(rawStandings, sg)
  const byRound = { r32: [], r16: [], quarter: [], semi: [], bronze: [], final: [] }
  sg.forEach(g => {
    const round = getRound(g)
    if (byRound[round]) byRound[round].push(g)
  })
  Object.keys(byRound).forEach(round => { byRound[round] = orderedKnockoutRound(byRound[round], round) })

  const slot = (items, count) => Array.from({ length: count }, (_, idx) => items[idx] || null)
  const r32 = slot(projectedR32Games(byRound.r32, groups), 16)
  const r16 = slot(byRound.r16.map(officialKnockoutPlaceholderGame), 8)
  const qf = slot(byRound.quarter.map(officialKnockoutPlaceholderGame), 4)
  const sf = slot(byRound.semi.map(officialKnockoutPlaceholderGame), 2)
  const bronze = slot(byRound.bronze.map(officialKnockoutPlaceholderGame), 1)
  const final = slot(byRound.final.map(officialKnockoutPlaceholderGame), 1)
  const bottomGroups = groups.slice(0, 12)

  function roundCol(className, title, games, side, spans) {
    const sideClass = side === 'right' ? 'wall-round-right' : 'wall-round-left'
    const content = games.map((game, idx) => {
      const span = spans[idx]
      return `<div class="wall-slot" style="grid-row:${span.start + 2} / ${span.end + 2}">${wallMatchHTML(game)}</div>`
    }).join('')
    return `
      <div class="wall-col ${sideClass} ${className}">
        <div class="wall-title">${esc(title)}</div>
        ${content}
      </div>`
  }

  let html = `
    <div class="sec">Wall Chart</div>
    <div class="wall-toolbar">
      <button class="wall-toggle ${projectKnockouts ? 'wall-toggle-on' : ''}" id="wall-projection-btn">
        ${projectKnockouts ? 'Showing knockouts as it stands' : 'Knockouts as it stands'}
      </button>
    </div>
    <div class="wall-wrap"><div class="wall">${wallLinesSVG()}`

  const r32Spans = Array.from({ length: 8 }, (_, idx) => ({ start: idx, end: idx + 1 }))
  const r16Spans = [{ start: 0, end: 2 }, { start: 2, end: 4 }, { start: 4, end: 6 }, { start: 6, end: 8 }]
  const qfSpans = [{ start: 0, end: 4 }, { start: 4, end: 8 }]
  const sfSpans = [{ start: 0, end: 8 }]

  html += roundCol('wall-left-r32', 'Round of 32', r32.slice(0, 8), 'left', r32Spans)
  html += roundCol('wall-left-r16', 'Round of 16', r16.slice(0, 4), 'left', r16Spans)
  html += roundCol('wall-left-qf', 'Quarter-finals', qf.slice(0, 2), 'left', qfSpans)
  html += roundCol('wall-left-sf', 'Semi-finals', sf.slice(0, 1), 'left', sfSpans)

  html += `
    <div class="wall-col wall-centre">
      <div class="wall-centre-card" style="grid-row:3 / 5">
        <div class="wall-title">Bronze Final</div>
        ${bronze.map(wallMatchHTML).join('')}
      </div>
      <div class="wall-centre-card" style="grid-row:5 / 7">
        <div class="wall-title">Final</div>
        ${final.map(wallMatchHTML).join('')}
      </div>
    </div>`

  html += roundCol('wall-right-sf', 'Semi-finals', sf.slice(1, 2), 'right', sfSpans)
  html += roundCol('wall-right-qf', 'Quarter-finals', qf.slice(2, 4), 'right', qfSpans)
  html += roundCol('wall-right-r16', 'Round of 16', r16.slice(4, 8), 'right', r16Spans)
  html += roundCol('wall-right-r32', 'Round of 32', r32.slice(8, 16), 'right', r32Spans)
  html += `<div class="wall-bottom-groups">${bottomGroups.map(miniGroupHTML).join('') || '<div class="wall-empty">Groups unavailable</div>'}</div>`

  html += `</div></div>`
  return html
}

async function fetchChannelHighlights(channelId) {
  const url = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`
  try {
    let text
    if (window.electronAPI?.fetchText) {
      text = await window.electronAPI.fetchText(url)
    } else {
      const res = await fetch(url)
      if (!res.ok) return []
      text = await res.text()
    }
    const doc = new DOMParser().parseFromString(text, 'application/xml')
    const entries = [...doc.querySelectorAll('entry')]
    return entries.map(entry => {
      let videoId = ''
      const vidEl = entry.getElementsByTagNameNS('http://www.youtube.com/xml/schemas/2015', 'videoId')[0]
      if (vidEl) {
        videoId = vidEl.textContent.trim()
      } else {
        try {
          const href = entry.querySelector('link')?.getAttribute('href') || ''
          videoId = new URL(href).searchParams.get('v') || ''
        } catch (_) {}
      }
      return { title: entry.querySelector('title')?.textContent || '', videoId }
    }).filter(v => v.videoId && /^[\w-]{6,20}$/.test(v.videoId) && isHighlightVideo(v.title))
  } catch (_) { return [] }
}

// Matches FIFA's "Highlights | Team A 1-0 Team B | ..." titles as well as
// BBC's full-match recap format "Team A v Team B | 2026 FIFA World Cup | Group X",
// which never uses the literal word "highlights".
function isHighlightVideo(title) {
  return /highlights/i.test(title) || /\sv\s.+\|.*world cup/i.test(title)
}

function loadPersistedHighlights() {
  try {
    const saved = JSON.parse(localStorage.getItem('wc2026_highlights') || '{}')
    if (Array.isArray(saved.bbc))  bbcHighlightsCache  = saved.bbc
    if (Array.isArray(saved.fifa)) fifaHighlightsCache = saved.fifa
  } catch (_) {}
}

function saveHighlights() {
  try {
    localStorage.setItem('wc2026_highlights', JSON.stringify({ bbc: bbcHighlightsCache, fifa: fifaHighlightsCache }))
  } catch (_) {}
}

async function fetchHighlights() {
  const [bbc, fifa] = await Promise.all([
    fetchChannelHighlights('UCli0KmmXMDjcgqvsheHfv-Q'),
    fetchChannelHighlights('UCpcTrCXblq78GZrTUTLWeBw'),
  ])
  let changed = false
  if (bbc.length) {
    const seen = new Set(bbcHighlightsCache.map(v => v.videoId))
    const fresh = bbc.filter(v => !seen.has(v.videoId))
    if (fresh.length) { bbcHighlightsCache = [...bbcHighlightsCache, ...fresh]; changed = true }
  }
  if (fifa.length) {
    const seen = new Set(fifaHighlightsCache.map(v => v.videoId))
    const fresh = fifa.filter(v => !seen.has(v.videoId))
    if (fresh.length) { fifaHighlightsCache = [...fifaHighlightsCache, ...fresh]; changed = true }
  }
  if (changed) { saveHighlights(); render() }
}

function stripDiacritics(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '')
}

function nameVariants(name) {
  const n = stripDiacritics(name.toLowerCase().trim())
  const vs = [n]
  // ESPN truncates with hyphens e.g. "Bosnia-Herz" → also try "Bosnia"
  const hyphenIdx = n.indexOf('-')
  if (hyphenIdx > 2) vs.push(n.slice(0, hyphenIdx))
  // Known FIFA/ESPN name differences (all pre-normalized, no diacritics)
  const subs = {
    'south korea': 'korea republic',
    'korea republic': 'south korea',
    'turkiye': 'turkey',
    'turkey': 'turkiye',
    'ivory coast': "cote d'ivoire",
    "cote d'ivoire": 'ivory coast',
    "coted'ivoire": 'ivory coast',
    'czechia': 'czech republic',
    'czech republic': 'czechia',
  }
  if (subs[n]) vs.push(subs[n])
  return vs
}

function findHighlight(g) {
  if (g.state !== 'post') return null
  const home = g.h.short.toLowerCase().trim()
  const away = g.a.short.toLowerCase().trim()
  if (!home || !away || home === 'tbd' || away === 'tbd') return null
  const homeVars = nameVariants(home)
  const awayVars = nameVariants(away)
  const match = cache => cache.find(v => {
    const t = stripDiacritics(v.title.toLowerCase())
    return homeVars.some(h => t.includes(h)) && awayVars.some(a => t.includes(a))
  })
  return match(bbcHighlightsCache) || match(fifaHighlightsCache) || null
}

function openHighlight(videoId) {
  const url = `https://www.youtube.com/watch?v=${videoId}`
  if (window.electronAPI?.openExternal) {

  }
}

const statsCache = {}

function statVal(statsArr, name) {
  const item = (statsArr || []).find(s => s.name === name)
  return item ? String(item.displayValue ?? item.value ?? '') : null
}

const STAT_ROWS = [
  ['Total Shots',   'totalShots'],
  ['On Target',     'shotsOnTarget'],
  ['Blocked Shots', 'blockedShots'],
  ['Corners',       'wonCorners'],
  ['Fouls',         'foulsCommitted'],
  ['Yellow Cards',  'yellowCards'],
  ['Red Cards',     'redCards'],
  ['Saves',         'saves'],
  ['Offsides',      'offsides'],
]

function renderStatsContent(summary, game) {
  const teams = (summary.boxscore || {}).teams || []
  const homeTeam = teams.find(t => t.homeAway === 'home') || teams[0]
  const awayTeam = teams.find(t => t.homeAway === 'away') || teams[1]

  if (!homeTeam && !awayTeam) {
    return `<div class="stats-loading">No statistics available for this match.</div>`
  }

  const hS = (homeTeam || {}).statistics || []
  const aS = (awayTeam || {}).statistics || []

  const hPoss = parseFloat(statVal(hS, 'possessionPct') || '0')
  const aPoss = parseFloat(statVal(aS, 'possessionPct') || '0')
  const showPoss = hPoss > 0 || aPoss > 0

  // Off target = total - on target (not a direct stat)
  const hOffTarget = (() => { const t = Number(statVal(hS, 'totalShots')), o = Number(statVal(hS, 'shotsOnTarget')); return (!isNaN(t) && !isNaN(o)) ? String(t - o) : null })()
  const aOffTarget = (() => { const t = Number(statVal(aS, 'totalShots')), o = Number(statVal(aS, 'shotsOnTarget')); return (!isNaN(t) && !isNaN(o)) ? String(t - o) : null })()

  const goals = (summary.keyEvents || [])
    .filter(e => e.scoringPlay === true)
    .sort((a, b) => ((a.period || {}).number || 0) * 10000 + ((a.clock || {}).value || 0) - (((b.period || {}).number || 0) * 10000 + ((b.clock || {}).value || 0)))

  const goalsHTML = goals.length ? `
    <div class="stats-goals">
      <div class="stats-section-lbl">Goal Scorers</div>
      ${goals.map(g => {
        const isHome = String((g.team || {}).id) === String(game.h.id)
        const scorer = ((g.participants || [])[0] || {}).athlete || {}
        const type = (g.type || {}).type || ''
        const suffix = type === 'own-goal' ? ' (OG)' : type.startsWith('penalty') ? ' (P)' : ''
        const name = scorer.displayName ? `${esc(scorer.displayName)}${suffix}` : ''
        return `
          <div class="stats-goal-row">
            <div class="stats-goal-home">${isHome ? name : ''}</div>
            <div class="stats-goal-min">${esc((g.clock || {}).displayValue || '')}</div>
            <div class="stats-goal-away">${!isHome ? name : ''}</div>
          </div>`
      }).join('')}
    </div>` : ''

  const isLive = game.state === 'in', isPost = game.state === 'post'
  const scoreHTML = (isLive || isPost) ? `${esc(game.h.score)} : ${esc(game.a.score)}` : 'vs'
  const statusHTML = isLive
    ? `<div class="stats-match-status stats-match-status-live">● LIVE · ${esc(game.clock)}</div>`
    : `<div class="stats-match-status stats-match-status-post">Full Time</div>`

  const rowsHTML = STAT_ROWS.map(([label, name]) => {
    const hVal = statVal(hS, name)
    const aVal = statVal(aS, name)
    if (hVal === null && aVal === null) return ''
    return `
      <div class="stats-row">
        <div class="stats-val-home">${esc(hVal ?? '-')}</div>
        <div class="stats-lbl">${esc(label)}</div>
        <div class="stats-val-away">${esc(aVal ?? '-')}</div>
      </div>`
  })

  // Insert off-target after on-target
  const onTargetIdx = rowsHTML.findIndex((_, i) => STAT_ROWS[i]?.[1] === 'shotsOnTarget')
  if (hOffTarget !== null || aOffTarget !== null) {
    const offRow = `
      <div class="stats-row">
        <div class="stats-val-home">${esc(hOffTarget ?? '-')}</div>
        <div class="stats-lbl">Off Target</div>
        <div class="stats-val-away">${esc(aOffTarget ?? '-')}</div>
      </div>`
    rowsHTML.splice(onTargetIdx + 1, 0, offRow)
  }

  return `
    <div class="stats-header">
      <div class="stats-teams">
        <div class="stats-team">
          ${game.h.logo ? `<img class="stats-team-logo" src="${esc(game.h.logo)}" onerror="this.style.display='none'">` : ''}
          <div class="stats-team-name">${esc(game.h.short)}</div>
        </div>
        <div class="stats-score">${scoreHTML}</div>
        <div class="stats-team">
          ${game.a.logo ? `<img class="stats-team-logo" src="${esc(game.a.logo)}" onerror="this.style.display='none'">` : ''}
          <div class="stats-team-name">${esc(game.a.short)}</div>
        </div>
      </div>
      ${statusHTML}
    </div>
    <div class="stats-body">
      ${goalsHTML}
      ${showPoss ? `
        <div class="stats-poss">
          <div class="stats-poss-labels">
            <span>${hPoss}%</span>
            <span class="stats-poss-lbl">Possession</span>
            <span>${aPoss}%</span>
          </div>
          <div class="stats-poss-bar">
            <div class="stats-poss-home" style="width:${hPoss}%"></div>
            <div class="stats-poss-away" style="width:${aPoss}%"></div>
          </div>
        </div>` : ''}
      ${rowsHTML.join('') || '<div class="stats-loading">No match statistics available yet.</div>'}
    </div>
    ${(() => { const hl = game && findHighlight(game); return hl ? `<div class="stats-hl"><button class="stats-hl-btn" data-vid="${esc(hl.videoId)}">▶ Watch highlights</button></div>` : '' })()}
  `
}

function gameById(eventId) {
  const all = [...(todayCache || []).map(mapGame), ...(schedCache || []).map(mapGame)]
  return all.find(g => g.id === eventId) || null
}

async function openMatchStats(eventId) {
  const overlay = document.getElementById('stats-overlay')
  const content = document.getElementById('stats-content')
  const game = gameById(eventId)

  if (game) {
    const sc = (game.state !== 'pre') ? `${esc(game.h.score)} : ${esc(game.a.score)}` : 'vs'
    content.innerHTML = `
      <div class="stats-header">
        <div class="stats-teams">
          <div class="stats-team">
            ${game.h.logo ? `<img class="stats-team-logo" src="${esc(game.h.logo)}" onerror="this.style.display='none'">` : ''}
            <div class="stats-team-name">${esc(game.h.short)}</div>
          </div>
          <div class="stats-score">${sc}</div>
          <div class="stats-team">
            ${game.a.logo ? `<img class="stats-team-logo" src="${esc(game.a.logo)}" onerror="this.style.display='none'">` : ''}
            <div class="stats-team-name">${esc(game.a.short)}</div>
          </div>
        </div>
      </div>
      <div class="stats-loading">Loading statistics…</div>`
  } else {
    content.innerHTML = `<div class="stats-loading">Loading…</div>`
  }

  overlay.classList.add('open')

  try {
    let summary = statsCache[eventId]
    if (!summary) {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary?event=${encodeURIComponent(eventId)}`)
      if (!res.ok) throw new Error('not ok')
      summary = await res.json()
      // Only cache once the match is final - stats/goals keep changing while live
      if (game && game.state === 'post') statsCache[eventId] = summary
    }
    if (overlay.classList.contains('open')) {
      content.innerHTML = renderStatsContent(summary, game || {})
    }
  } catch (_) {
    if (overlay.classList.contains('open')) {
      content.innerHTML = `<div class="stats-loading">Could not load match statistics.</div>`
    }
  }
}

function closeMatchStats() {
  document.getElementById('stats-overlay').classList.remove('open')
}

function allTeamsList(groups) {
  const map = new Map()
  groups.forEach(group => {
    group.teams.forEach(t => {
      const key = (t.abbr || t.name || '').toUpperCase()
      if (key && !map.has(key)) map.set(key, t)
    })
  })
  return [...map.values()].sort((a, b) => a.name.localeCompare(b.name))
}

function renderTeams(groups) {
  const teams = allTeamsList(groups)
  if (!teams.length) return emptyHTML('No teams available', 'Team list needs the schedule or standings to load')

  let html = `<div class="sec">Teams</div><div class="teams-grid">`
  teams.forEach(t => {
    html += `
      <div class="team-card" data-team-abbr="${esc(t.abbr)}" data-team-name="${esc(t.name)}">
        ${t.logo ? `<img class="team-card-flag" src="${esc(t.logo)}" onerror="this.style.display='none'">` : '<div class="team-card-flag"></div>'}
        <div class="team-card-name">${esc(t.name)}</div>
      </div>`
  })
  html += `</div>`
  return html
}

function teamPerspective(g, abbr, name) {
  const an = (abbr || '').toUpperCase(), nn = (name || '').toLowerCase()
  const isHome = an ? (g.h.abbr || '').toUpperCase() === an : g.h.short.toLowerCase() === nn
  return { isHome, self: isHome ? g.h : g.a, opp: isHome ? g.a : g.h }
}

function teamGames(sg, abbr, name) {
  const an = (abbr || '').toUpperCase(), nn = (name || '').toLowerCase()
  return sg
    .filter(g => {
      const hMatch = an ? (g.h.abbr || '').toUpperCase() === an : g.h.short.toLowerCase() === nn
      const aMatch = an ? (g.a.abbr || '').toUpperCase() === an : g.a.short.toLowerCase() === nn
      return hMatch || aMatch
    })
    .sort((a, b) => a.date - b.date)
}

function teamResultRowHTML(g, abbr, name) {
  const { isHome, self, opp } = teamPerspective(g, abbr, name)
  const selfScore = Number(self.score), oppScore = Number(opp.score)
  const resultClass = selfScore > oppScore ? 'team-row-w' : selfScore < oppScore ? 'team-row-l' : 'team-row-d'
  const resultLetter = selfScore > oppScore ? 'W' : selfScore < oppScore ? 'L' : 'D'
  return `
    <div class="team-row">
      <div class="team-row-badge ${resultClass}">${resultLetter}</div>
      ${opp.logo ? `<img class="team-row-flag" src="${esc(opp.logo)}" onerror="this.style.display='none'">` : ''}

      <div class="team-row-score">${esc(self.score)} - ${esc(opp.score)}</div>

function teamFixtureRowHTML(g, abbr, name) {

// Returns this team's scorers sorted by most goals first, or null while goal
// data is still being fetched (see ensureGoalscorers).
function teamScorers(abbr, name) {
  if (!scorersCache) return null
  const an = (abbr || '').toUpperCase(), nn = (name || '').toLowerCase()
  return scorersCache
    .filter(p => an ? (p.teamAbbr || '').toUpperCase() === an : (p.teamName || '').toLowerCase() === nn)
    .sort((a, b) => b.goals - a.goals || a.name.localeCompare(b.name))

let scorersCache = null
let scorersLoading = false
const scorersFetchedIds = new Set()

// Tallies goals from a finished match's summary into `map`, keyed by athlete id.
// Own goals count toward the team's score but are conventionally excluded from scorer charts.
function addGoalsFromSummary(map, summary, game) {
  const goals = (summary.keyEvents || []).filter(e => e.scoringPlay === true && ((e.type || {}).type) !== 'own-goal')
  goals.forEach(ev => {
    const scorer = ((ev.participants || [])[0] || {}).athlete || {}
    if (!scorer.id || !scorer.displayName) return
    const isHome = String((ev.team || {}).id) === String(game.h.id)
    const team = isHome ? game.h : game.a
    const entry = map.get(scorer.id) || { id: scorer.id, name: scorer.displayName, goals: 0, teamAbbr: team.abbr, teamName: team.short, teamLogo: team.logo }
    entry.goals += 1
    map.set(scorer.id, entry)
  })
}

// Fetches match summaries for any completed games not yet tallied, aggregates
// goalscorers, and re-renders. Cheap to call repeatedly: no-ops once everything
// completed so far has been fetched.
async function ensureGoalscorers() {
  if (scorersLoading) return
  const sg = (schedCache || []).map(mapGame)
  const missing = sg.filter(g => g.state === 'post' && !scorersFetchedIds.has(g.id))
  if (!missing.length) {
    if (!scorersCache) scorersCache = []
    return
  }

  scorersLoading = true
  const map = new Map((scorersCache || []).map(p => [p.id, p]))
  const results = await Promise.allSettled(missing.map(async g => {
    let summary = statsCache[g.id]
    if (!summary) {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary?event=${encodeURIComponent(g.id)}`)
      if (!res.ok) throw new Error('not ok')
      summary = await res.json()
      statsCache[g.id] = summary
    }
    return { g, summary }
  }))
  results.forEach(r => {
    if (r.status !== 'fulfilled') return
    addGoalsFromSummary(map, r.value.summary, r.value.g)
    scorersFetchedIds.add(r.value.g.id)
  })
  scorersCache = [...map.values()].sort((a, b) => b.goals - a.goals || a.name.localeCompare(b.name))
  scorersLoading = false
  if (activeTab === 'scorers') render()
  if (openTeam) renderTeamModalContent(openTeam.abbr, openTeam.name)
}

function renderGoalscorers(players) {
  if (players === null) return `<div class="stats-loading">Loading goalscorers…</div>`
  if (!players.length) return emptyHTML('No goals scored yet', 'Check back once matches have been played')

  let html = `<div class="sec">Top Scorers</div><div class="scorers-list">`
  players.forEach((p, i) => {
    html += `
      <div class="scorer-row">
        <div class="scorer-rank">${i + 1}</div>
        ${p.teamLogo ? `<img class="scorer-flag" src="${esc(p.teamLogo)}" onerror="this.style.display='none'">` : '<div class="scorer-flag"></div>'}
        <div class="scorer-info">
          <div class="scorer-name">${esc(p.name)}</div>
          <div class="scorer-team">${esc(p.teamName)}</div>
        </div>
        <div class="scorer-goals">${esc(p.goals)}</div>
      </div>`
  })
  html += `</div>`
  return html
}

async function fetchData(force = false) {
  const now = Date.now()
  if (!force && now - lastFetch < 30000) return
  lastFetch = now

  const [todayRes, schedRes, standingsRes] = await Promise.allSettled([
    fetch(TODAY_URL()).then(r => r.json()),
    (!force && schedCache) ? Promise.resolve(null) : fetch(SCHED_URL).then(r => r.json()),
    (!force && standingsCache) ? Promise.resolve(null) : fetch(STANDINGS_URL).then(r => r.json()),
  ])

  if (todayRes.status === 'fulfilled') todayCache = todayRes.value.events || []
  else if (!todayCache) todayCache = []

  if (schedRes.status === 'fulfilled' && schedRes.value) schedCache = schedRes.value.events || []
  else if (!schedCache) schedCache = []

  if (standingsRes.status === 'fulfilled' && standingsRes.value) standingsCache = standingsRes.value
  else if (!standingsCache) standingsCache = {}

  const failed = [todayRes, schedRes, standingsRes].some(r => r.status === 'rejected')
  document.getElementById('error-banner').style.display = failed ? 'block' : 'none'

  render()
}

// Refresh full schedule and standings every 10 mins
setInterval(() => { schedCache = null; standingsCache = null; fetchData(true) }, 600000)
// Refresh today every 30s
setInterval(() => fetchData(true), 30000)

function render() {
  const tg = (todayCache || []).map(mapGame)
  const sg = (schedCache || []).map(mapGame)

  const live = tg.filter(g => g.state === 'in')
  const pre  = tg.filter(g => g.state === 'pre')
  const post = tg.filter(g => g.state === 'post')
  const totalPlayed = sg.filter(g => g.state === 'post').length

  tickClock()

  // Live badge + titlebar
  const liveBadge = document.getElementById('live-badge')
  liveBadge.style.display = live.length > 0 ? 'inline-block' : 'none'
  document.getElementById('titlebar-txt').innerHTML =
    live.length > 0 ? '<span class="live-dot"></span> World Cup 2026 · LIVE' : '⚽ World Cup 2026'

  // Stats bar
  const sbToday = document.getElementById('sb-today')
  document.getElementById('sb-today-v').textContent = live.length || pre.length || 0
  document.getElementById('sb-today-l').textContent = live.length > 0 ? 'Live' : 'Today'
  sbToday.className = 'sb' + (live.length > 0 ? ' sb-live' : '')
  document.getElementById('sb-done-v').textContent = post.length
  document.getElementById('sb-played-v').textContent = totalPlayed
  document.getElementById('sb-remaining-v').textContent = 104 - totalPlayed

  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.toggle('tab-active', tab.dataset.tab === activeTab)
  })

  const groups = groupsForView(standingsCache || {}, sg)
  const teamGroupMap = buildTeamGroupMap(groups)

  let html = ''
  if (activeTab === 'all') html = renderAllMatches(sg, teamGroupMap)
  else if (activeTab === 'groups') html = renderGroups(standingsCache || {}, sg)
  else if (activeTab === 'wall') html = renderWallChart(sg, standingsCache || {})
  else if (activeTab === 'teams') html = renderTeams(groups)
  else if (activeTab === 'scorers') { html = renderGoalscorers(scorersCache); ensureGoalscorers() }
  else html = renderToday(tg, teamGroupMap)

  const scroll = document.getElementById('main-scroll')
  scroll.innerHTML = html
  scroll.scrollTop = scrollByTab[activeTab] || 0

  // Show content
  document.getElementById('loading').style.display = 'none'
  document.getElementById('content').style.display = 'flex'
}

function fmtCountdown(ms) {
  if (ms <= 0) return 'Starting now'
  const s = Math.floor(ms / 1000)
  if (s < 60) return `${s}s`
  const m = Math.floor(s / 60)
  if (m < 60) return `${m}m`
  const h = Math.floor(m / 60), rm = m % 60
  return rm > 0 ? `${h}h ${rm}m` : `${h}h`
}

function tickClock() {
  const now = new Date()
  const clockEl = document.getElementById('clock')
  const nextEl = document.getElementById('next-match')
  if (clockEl) clockEl.textContent = now.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' })
  if (nextEl) {
    const upcoming = (schedCache || [])
      .map(mapGame)
      .filter(g => g.state === 'pre' && g.date)
      .sort((a, b) => new Date(a.date) - new Date(b.date))[0]
    if (upcoming) {
      const diff = new Date(upcoming.date) - now
      const cd = fmtCountdown(diff)
      nextEl.textContent = `Next · ${cd}`
    } else {
      nextEl.textContent = ''
    }
  }
}

tickClock()
setInterval(tickClock, 1000)

// Refresh button: forces a full re-fetch of today/schedule/standings and
// shows a spinner + "Refreshing…" label for the duration of the request.
document.getElementById('refresh-btn').addEventListener('click', async () => {
  const btn = document.getElementById('refresh-btn')
  const label = document.getElementById('refresh-label')
  if (btn.classList.contains('refreshing')) return
  btn.classList.add('refreshing')
  label.textContent = 'Refreshing…'
  try {
    await fetchData(true)
  } finally {
    btn.classList.remove('refreshing')
    label.textContent = 'Refresh'
  }
})

// Preserve per-tab scroll positions across refreshes and tab switches.
document.getElementById('main-scroll').addEventListener('scroll', e => {
  scrollByTab[activeTab] = e.currentTarget.scrollTop
})

document.getElementById('main-scroll').addEventListener('click', e => {
  if (e.target.closest('#wall-projection-btn')) {
    projectKnockouts = !projectKnockouts
    render()
    return
  }
  const hlBtn = e.target.closest('.hl-btn')
  if (hlBtn && /^[\w-]{6,20}$/.test(hlBtn.dataset.vid || '')) { openHighlight(hlBtn.dataset.vid); return }
  const teamTarget = e.target.closest('.team-link, .team-card')
  if (teamTarget) { openTeamModal(teamTarget.dataset.teamAbbr, teamTarget.dataset.teamName); return }
  const gameEl = e.target.closest('[data-game-id]')
  if (gameEl && gameEl.classList.contains('stats-clickable')) openMatchStats(gameEl.dataset.gameId)
})

document.getElementById('yt-close').addEventListener('click', closeHighlight)
document.getElementById('yt-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeHighlight()
})

document.getElementById('stats-close').addEventListener('click', closeMatchStats)
document.getElementById('stats-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) { closeMatchStats(); return }
  const hlBtn = e.target.closest('.stats-hl-btn')
  if (hlBtn && /^[\w-]{6,20}$/.test(hlBtn.dataset.vid || '')) { closeMatchStats(); openHighlight(hlBtn.dataset.vid) }
})

document.getElementById('team-close').addEventListener('click', closeTeamModal)
document.getElementById('team-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) { closeTeamModal(); return }
  const teamLink = e.target.closest('.team-link')
  if (teamLink) openTeamModal(teamLink.dataset.teamAbbr, teamLink.dataset.teamName)
})

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeMatchStats(); closeHighlight(); closeTeamModal() }
})

// Tabs
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab')
  if (!tab || tab.dataset.tab === activeTab) return
  const scroll = document.getElementById('main-scroll')
  scrollByTab[activeTab] = scroll.scrollTop
  activeTab = tab.dataset.tab
  render()
})

// Boot
loadPersistedHighlights()
fetchData(true)
fetchHighlights()
setInterval(fetchHighlights, 300000)
</script>
